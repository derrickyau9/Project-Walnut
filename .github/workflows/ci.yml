name: simulator-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m tools.check_native_dependencies
      - name: Linux RTL simulator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Isolated Windows RTL simulator
        if: runner.os == 'Windows'
        run: python tools/fetch_iverilog.py --dest "$env:TEMP\hf-iverilog-runtime" --lock fpga/testbench/toolchain-manifest.json
      - run: python tools/build_native.py
      - run: python -m unittest discover -s tests -v
        env:
          HF_FULL_FRAME_TEST: '1'
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: python -m unittest discover -s hardware/tools -v
      - run: python -m unittest discover -s fpga/testbench -v
      - run: node --check daos/console/app.js
