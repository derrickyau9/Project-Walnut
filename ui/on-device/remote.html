<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DaOS 联机相机</title>
<style>body{margin:0;background:#080808;color:#eee;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:25px;letter-spacing:2px;font-weight:500}section{padding:18px 0;border-bottom:1px solid #333}button,input{font:inherit;color:#fff;background:#202020;border:1px solid #666;border-radius:5px;min-height:56px;padding:0 16px;margin:4px}input{max-width:220px}img{display:block;width:100%;background:#111;aspect-ratio:3/2;object-fit:contain}.row{display:flex;gap:8px;flex-wrap:wrap}p{color:#aaa;line-height:1.6}#message{white-space:pre-wrap}button:active{background:#777}</style>
<main><h1>DaOS　联机相机</h1><section id="pair"><p>输入机身显示的配对码。相机取景来源与功能以设备实际能力为准。</p><input id="pin" inputmode="numeric" placeholder="六位配对码" maxlength="6"><button onclick="pair()">配对</button></section>
<section><div class="row"><button onclick="acquire()">申请控制</button><button onclick="release()">释放控制</button><button onclick="refresh()">刷新状态</button></div><p id="source">等待连接</p><img id="preview" alt="相机取景"></section>
<section><div class="row"><label>曝光 / 微秒<input id="exposure" type="number" min="100" max="30000000" value="10000"></label><label>模拟增益 / 倍<input id="gain" type="number" min="1" max="16" step="0.01" value="1"></label></div><button onclick="configure()">应用参数</button><button onclick="shoot()">拍摄一张</button><button onclick="query()">核实原请求</button></section>
<section><button onclick="photos()">照片库</button><div id="photos"></div></section><p id="message"></p></main>
<script>let csrf='',session='',requestId=localStorage.getItem('daos-capture-uuid')||'',timer=null;const $=id=>document.getElementById(id);function message(value){$('message').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}async function rpc(method,params={}){const response=await fetch('/rpc',{method:'POST',headers:{'Content-Type':'application/json','X-DaOS-CSRF':csrf},body:JSON.stringify({method,params,session})});const data=await response.json();if(data.error)throw Error(data.error);return data.result}async function pair(){try{const response=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});const value=await response.json();if(value.error)throw Error(value.error);csrf=value.csrf;$('pair').hidden=true;await refresh();timer=setInterval(()=>{$('preview').src='/preview.jpg?t='+Date.now();if(session)rpc('session.heartbeat').catch(e=>{session='';message(e.message)})},1200)}catch(e){message(e.message)}}async function acquire(){try{session=(await rpc('session.acquire')).session;message('已取得控制；机身操作可随时接管')}catch(e){message(e.message)}}async function release(){try{await rpc('session.release');session='';message('已释放控制')}catch(e){message(e.message)}}async function refresh(){try{const state=await rpc('getState');$('source').textContent=(state.simulated?'HF-Sim 合成取景':'设备图像')+' · '+state.connection+' · '+state.capture_status;message(state);if(state.settings){$('exposure').value=state.settings.requested_exposure_us;$('gain').value=state.settings.requested_analogue_gain}}catch(e){message(e.message)}}async function configure(){try{message(await rpc('configure',{requested_exposure_us:Number($('exposure').value),requested_analogue_gain:Number($('gain').value)}))}catch(e){message(e.message)}}async function shoot(){try{if(requestId){const old=await rpc('query',{request_id:requestId});if(!['complete','failed','cancelled'].includes(old.status))throw Error('上次拍摄尚未确认，请核实原请求 '+requestId)}requestId=crypto.randomUUID();localStorage.setItem('daos-capture-uuid',requestId);message(await rpc('capture',{request_id:requestId}))}catch(e){message(e.message+'；保留原请求 '+requestId)}}async function query(){if(!requestId)return;try{message(await rpc('query',{request_id:requestId}))}catch(e){message(e.message)}}async function photos(){try{const result=await rpc('listPhotos',{limit:60});const rows=Array.isArray(result)?result:(result.items||[]);$('photos').replaceChildren();for(const row of rows){const button=document.createElement('button');button.textContent=row.filename||row.photo_uuid;button.onclick=()=>download(row.photo_uuid);$('photos').append(button)}}catch(e){message(e.message)}}async function download(photo){try{const transfer=await rpc('transfer.create',{photo_uuid:photo});if(transfer.bytes>128*1024*1024){await rpc('transfer.cancel',{transfer_id:transfer.transfer_id});throw Error('此文件超过浏览器128MiB上限，请用SDK流式断点下载')}const parts=[];for(let offset=0;offset<transfer.bytes;offset+=transfer.chunk_bytes){const response=await fetch('/transfer/'+transfer.transfer_id+'/'+offset);if(!response.ok)throw Error('传输中断，可用SDK恢复原传输');parts.push(await response.arrayBuffer());message('传输 '+Math.min(transfer.bytes,offset+transfer.chunk_bytes)+' / '+transfer.bytes)}const blob=new Blob(parts);const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))).map(v=>v.toString(16).padStart(2,'0')).join('');if(digest!==transfer.sha256)throw Error('SHA256校验失败，未保存文件');await rpc('transfer.commit',{transfer_id:transfer.transfer_id,sha256:digest});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=photo+transfer.extension;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){message(e.message)}}</script></html>
