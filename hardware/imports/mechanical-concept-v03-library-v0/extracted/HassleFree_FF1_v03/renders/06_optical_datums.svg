81" y="468" fill="#253940" font-size="17" font-weight="400" text-anchor="start">Control PCB envelope</text><rect x="1250" y="496" width="18" height="18" fill="#b37856" stroke="none" rx="0"/><text x="1281" y="512" fill="#253940" font-size="17" font-weight="400" text-anchor="start">Heat spreader envelope</text><text x="1250" y="596" fill="#63776f" font-size="16" font-weight="400" text-anchor="start">Independent sensor support</text><text x="1250" y="620" fill="#63776f" font-size="16" font-weight="400" text-anchor="start">Removable E / EF cartridge</text><text x="1250" y="644" fill="#63776f" font-size="16" font-weight="400" text-anchor="start">Optical datum stays fixed</text><rect x="70" y="718" width="1460" height="204" fill="#e2e8e4" stroke="none" rx="14"/><text x="96" y="757" fill="#253940" font-size="20" font-weight="700" text-anchor="start">WHAT THESE DIMENSIONS MEAN</text><text x="96" y="798" fill="#253940" font-size="22" font-weight="400" text-anchor="start">36 × 24 mm is the required active area. 18 / 44 mm are public nominal flange references.</text><text x="96" y="834" fill="#253940" font-size="21" font-weight="400" text-anchor="start">Every shell, bore, bolt circle, wall and component envelope remains a provisional design assumption.</text><text x="96" y="870" fill="#253940" font-size="21" font-weight="400" text-anchor="start">No bayonet profile, manufacturing tolerance, optical clearance, thermal or strength certification is provided.</text><text x="72" y="961" fill="#6b7d82" font-size="17" font-weight="400" text-anchor="start">Schematic only. Transverse heights are illustrative. Inspect STEP and the editable source for three-dimensional geometry.</text></g></svg>