# DaOS BSD Unix camera appliance profile, FreeBSD 15.1 source options.
# Base shell, utilities, rc, networking/SSH, devfs, Capsicum and UFS/ZFS remain.
# The build guest keeps its existing toolchain. The staged target omits it;
# a developer image/SDK is a separate profile, not implied by this image.
WITHOUT_TOOLCHAIN=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_KERNEL_SYMBOLS=yes
WITHOUT_TESTS=yes
WITHOUT_MAN=yes
WITHOUT_EXAMPLES=yes
WITHOUT_LIB32=yes
# Use the upstream default system-compiler/linker version checks. Do not force
# CROSSBUILD_TC or suppress compiler bootstrap/version compatibility checks.
