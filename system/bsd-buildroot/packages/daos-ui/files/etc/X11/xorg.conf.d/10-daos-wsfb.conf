Section "ServerLayout"
    Identifier "DaOS"
    Screen 0 "DaOS Screen"
    InputDevice "DaOS Keyboard" "CoreKeyboard"
    InputDevice "DaOS Pointer" "CorePointer"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection

Section "Device"
    Identifier "DaOS Framebuffer"
    Driver "wsfb"
    Option "device" "/dev/ttyE0"
EndSection

Section "Screen"
    Identifier "DaOS Screen"
    Device "DaOS Framebuffer"
    DefaultDepth 24
EndSection

Section "InputDevice"
    Identifier "DaOS Keyboard"
    Driver "kbd"
    Option "Protocol" "wskbd"
    Option "Device" "/dev/wskbd"
    Option "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "DaOS Pointer"
    Driver "mouse"
    Option "Protocol" "wsmouse"
    Option "Device" "/dev/wsmouse"
EndSection
