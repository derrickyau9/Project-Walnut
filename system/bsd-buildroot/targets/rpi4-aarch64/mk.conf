# Private NetBSD world configuration for the initial DaOS core image.
# Passed through build.sh -V MAKECONF=<this file>, never /etc/mk.conf.
# Keep the C++ runtime required by the native DaOS camera service.
MKCXX=yes
MKLIBSTDCXX=yes
MKGCCCMDS=no
MKBINUTILS=no
MKGDB=no
MKPROFILE=no
MKDEBUG=no
MKDEBUGLIB=no
MKDEBUGKERNEL=no
MKCOMPAT=no
MKATF=no
MKKYUA=no
MKCATPAGES=no
MKDOC=no
MKHTML=no
MKINFO=no
MKMAN=no
MKPOSTFIX=no
MKLDAP=no
MKKERBEROS=no
MKYP=no
MKZFS=no

# X11/Qt/PyQt are a separate product layer, not yet part of this core build.
MKX11=no
MKX11FONTS=no

# Pin the build timestamp independently of the wall clock (2026-11-02 UTC).
MKREPRO=yes
MKREPRO_TIMESTAMP=1793577600
