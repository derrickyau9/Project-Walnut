# Private NetBSD world configuration for the initial DaOS core image.
# Passed through build.sh -V MAKECONF=<this file>, never /etc/mk.conf.
# Keep the C++ runtime required by the native DaOS camera service.
MKCXX=yes
MKLIBSTDCXX=yes
MKGCCCMDS=no
MKBINUTILS=no
MKGDB=no
MKPROFILE=no
MKDEBUG=no
MKDEBUGLIB=no
MKDEBUGKERNEL=no
MKCOMPAT=no
MKATF=no
MKKYUA=no
MKCATPAGES=no
MKDOC=no
MKHTML=no
MKINFO=no
MKMAN=no
MKPOSTFIX=no
MKLDAP=no
MKKERBEROS=yes
MKYP=no
MKZFS=no

# Build X11 from the same locked release sources for the Qt runtime.
MKX11=yes
MKX11FONTS=yes

# Pin the build timestamp independently of the wall clock (2026-11-02 UTC).
MKREPRO=yes
MKREPRO_TIMESTAMP=1793577600
